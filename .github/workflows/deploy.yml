name: Deploy Glue Job and Trigger Step Function

on:
  push:
    branches:
      - "main"
    paths:
      - 'glue_script/**'
  pull_request:
    branches:
      - "main"
    paths:
      - 'glue_script/**'

jobs:
  test:
    name: Run PySpark Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          java -version
          python --version
          pip list

      - name: Run Pytest Integration Tests
        run: cd glue_script && pytest
        env:
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python

  deploy:
    name: Deploy Glue Script to AWS
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.REGION_NAME }}

      - name: Deploy Glue Job
        run: |
          aws s3 cp glue_script/ s3://aws-glue-assets-${{ secrets.ACCOUNT_ID }}-${{ secrets.REGION_NAME }}/scripts/ --recursive

          aws glue update-job --job-name ecommerce-delta \
            --job-update '{
              "Role": "arn:aws:iam::${{ secrets.ACCOUNT_ID }}:role/service-role/${{ secrets.STEP_FUNCTIONS_ROLE }}",
              "Command": {
                "Name": "glueetl",
                "ScriptLocation": "s3://aws-glue-assets-${{ secrets.ACCOUNT_ID }}-${{ secrets.REGION_NAME }}/scripts/ecommerce-delta.py",
                "PythonVersion": "3"
              },
              "DefaultArguments": {
                "--job-language": "python",
                "--enable-continuous-cloudwatch-log": "true",
                "--enable-metrics": ""
              },
              "GlueVersion": "3.0",
              "WorkerType": "G.1X",
              "NumberOfWorkers": 2,
              "ExecutionProperty": {
                "MaxConcurrentRuns": 1
              }
            }'

      - name: Trigger Step Function Execution
        run: |
          aws stepfunctions start-execution \
            --state-machine-arn "arn:aws:states:${{ secrets.REGION_NAME }}:${{ secrets.ACCOUNT_ID }}:stateMachine:lakehouse" \
            --name "github-actions-$(date +%s)" \
            --input '{"Comment": "Triggered by GitHub Actions deployment"}'

      - name: Verify Execution
        run: echo "Glue job deployed and pipeline triggered successfully"
